description: Mogassam is a digital dentistry company building all-in-one dental 3D
  printing hardware and software for chairside, single-visit treatment. Its products
  include the DentCase automated all-in-one 3D printer with integrated CAM, automatic
  washing, and post-curing, the Microdent 1 Pro printer, and the DentPrint dental 3D
  printing software, used to produce dentures, dental models, surgical guides, and
  provisional and permanent restorations. The company was surfaced as a 500 Global
  portfolio company and added to the API Evangelist network. No public API, SDK, or
  developer documentation was found at the time of enrichment.
